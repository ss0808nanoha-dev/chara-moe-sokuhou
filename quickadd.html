<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登場回クイック投稿（自分用）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#fff4f0;color:#222;padding:14px;padding-bottom:60px}
h1{font-size:16px;color:#c04a00;margin:0 0 12px}
.card{background:#fff;border:1px solid #e8d0c0;border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#888;margin-bottom:4px}
input[type=text]{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #e0c0a0;border-radius:4px;margin-bottom:12px;font-family:inherit}
input:focus{outline:none;border-color:#e05a00;box-shadow:0 0 0 2px rgba(224,90,0,.15)}
.media-row{display:flex;gap:8px;margin-bottom:12px}
.media-btn{flex:1;font-size:14px;font-weight:700;padding:12px;border:2px solid #e0c0a0;border-radius:6px;background:#fff;color:#888;cursor:pointer}
.media-btn.on{background:#e05a00;color:#fff;border-color:#e05a00}
#vol-wrap{display:none}
.section-title{font-size:13px;font-weight:700;color:#c04a00;margin:4px 0 8px;border-bottom:1px dashed #e8d0c0;padding-bottom:4px}
.chara-block{position:relative;background:#fff8f3;border:1px solid #f0d4c0;border-radius:6px;padding:12px 12px 2px;margin-bottom:10px}
@keyframes dupflash{0%,60%{box-shadow:0 0 0 3px #e05a00;background:#ffe6d2}100%{box-shadow:none}}
.chara-block.dup-flash{animation:dupflash 1.6s ease-out}
.chara-block-no{font-size:11px;font-weight:700;color:#e05a00;margin-bottom:6px}
.chara-del{position:absolute;top:8px;right:10px;font-size:12px;color:#c00;cursor:pointer;background:none;border:none;padding:2px 4px}
.hint{font-size:10px;color:#aaa;margin:-8px 0 10px}
.add-chara-btn{display:block;width:100%;font-size:14px;font-weight:700;padding:11px;border:2px dashed #e05a00;border-radius:6px;background:#fff;color:#e05a00;cursor:pointer;margin-bottom:14px}
.add-chara-btn:active{background:#fff3e8}
.submit-btn{display:block;width:100%;font-size:16px;font-weight:700;padding:14px;border:none;border-radius:6px;background:#e05a00;color:#fff;cursor:pointer}
.submit-btn:active{background:#c04a00}
.submit-btn:disabled{background:#ccc}
#msg{font-size:12px;margin-top:8px;min-height:16px}
.back-btn{display:block;width:100%;margin-top:8px;font-size:13px;font-weight:700;padding:11px;border:2px solid #888;border-radius:6px;background:#fff;color:#555;cursor:pointer}
.back-btn:active{background:#f2f2f2}
.back-btn:disabled{color:#bbb;border-color:#ddd}
#msg.ok{color:#2a8a3a}
#msg.err{color:#c00}
#recent{margin-top:16px}
#recent h2{font-size:13px;color:#888;margin:0 0 8px}
.recent-item{background:#fff;border:1px solid #ecd2c2;border-left:4px solid #e05a00;border-radius:4px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.recent-item .chara{font-weight:700;color:#c04a00}
.recent-item .label{font-weight:700}
.recent-item .note{color:#888;font-size:12px;display:block}
.recent-item .media{font-size:10px;background:#fff0e0;color:#c04a00;border-radius:999px;padding:1px 7px;margin-right:4px}
.undo-btn{font-size:11px;color:#c00;cursor:pointer;float:right}
</style>
</head>
<body>
<h1>📝 登場回クイック投稿（自分用）</h1>
<div class="card">
  <div class="media-row">
    <button type="button" class="media-btn on" id="media-anime" onclick="setMedia('anime')">📺 アニメ</button>
    <button type="button" class="media-btn" id="media-manga" onclick="setMedia('manga')">📖 漫画</button>
  </div>

  <div id="vol-wrap">
    <label for="vol-inp">単行本 何巻？</label>
    <input type="text" id="vol-inp" placeholder="例：18" inputmode="numeric">
  </div>

  <label for="label-inp">登場回</label>
  <input type="text" id="label-inp" placeholder="例：3期5話" maxlength="60">

  <div class="section-title">この回に登場したキャラ</div>
  <div id="chara-blocks"></div>
  <datalist id="chara-list"></datalist>
  <button type="button" class="add-chara-btn" onclick="addCharaBlock(true)">＋ キャラクターを追加する</button>

  <button type="button" class="submit-btn" id="submit-btn" onclick="submitEntry()">まとめて投稿する</button>
  <div id="msg"></div>
  <div id="back-wrap"></div>
</div>

<div id="recent"></div>

<script>
var SUPABASE_URL = "https://xflcbgsonmvvzbefbreq.supabase.co";
var SUPABASE_KEY = "sb_publishable_in8cVtZwe3SbE0l6Y3Jf2Q_awVX6mJY";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
/* 本サイト(index.html)と同じ匿名ID方式。これで後からメインサイト側でも編集・削除依頼ができる */
var myIp=(function(){var v=lsGet("kmh_ip");if(!v){v=Math.random().toString(36).slice(2,10).toUpperCase();lsSet("kmh_ip",v);}return v;})();

var currentMedia="anime";
function setMedia(m){
  currentMedia=m;
  document.getElementById("media-anime").classList.toggle("on",m==="anime");
  document.getElementById("media-manga").classList.toggle("on",m==="manga");
  document.getElementById("vol-wrap").style.display=(m==="manga")?"block":"none";
}

/* キャラ1人分の入力欄(キャラ名＋ひとことコメント)。何人でも追加できる */
function renumberBlocks(){
  var blocks=document.querySelectorAll(".chara-block");
  for(var i=0;i<blocks.length;i++){
    blocks[i].querySelector(".chara-block-no").textContent="キャラ "+(i+1);
    /* 1人しかいないときは削除ボタンを出さない */
    blocks[i].querySelector(".chara-del").style.display=blocks.length>1?"":"none";
  }
}
function addCharaBlock(focus){
  var wrap=document.getElementById("chara-blocks");
  var div=document.createElement("div");
  div.className="chara-block";
  div.innerHTML=
    '<div class="chara-block-no"></div>'+
    '<button type="button" class="chara-del" onclick="removeCharaBlock(this)">✕ 削除</button>'+
    '<label>キャラクター名</label>'+
    '<input type="text" class="chara-name-inp" list="chara-list" placeholder="例：アレクシス・ネス" autocomplete="off">'+
    '<div class="hint">候補になくても、新しいキャラ名をそのまま入力すればOK</div>'+
    '<label>ひとことコメント（任意）</label>'+
    '<input type="text" class="chara-note-inp" placeholder="例：初登場シーン" maxlength="200">';
  wrap.appendChild(div);
  div.querySelector(".chara-name-inp").addEventListener("change",function(){ checkDuplicate(div); });
  renumberBlocks();
  if(focus) div.querySelector(".chara-name-inp").focus();
}
/* 同じキャラを2回入れたら、既に入力済みの欄へ移動する(重複した欄は片付ける) */
function findBlockByName(name,except){
  var blocks=document.querySelectorAll(".chara-block");
  for(var i=0;i<blocks.length;i++){
    if(blocks[i]===except) continue;
    if(blocks[i].querySelector(".chara-name-inp").value.trim()===name) return blocks[i];
  }
  return null;
}
function jumpToBlock(block){
  block.classList.remove("dup-flash");
  void block.offsetWidth;
  block.classList.add("dup-flash");
  block.scrollIntoView({behavior:"smooth",block:"center"});
  block.querySelector(".chara-note-inp").focus({preventScroll:true});
}
function checkDuplicate(block){
  var name=block.querySelector(".chara-name-inp").value.trim();
  if(!name) return;
  var existing=findBlockByName(name,block);
  if(!existing) return;
  var note=block.querySelector(".chara-note-inp").value.trim();
  if(note){
    block.querySelector(".chara-name-inp").value="";
  }else{
    block.remove();
    renumberBlocks();
  }
  var msg=document.getElementById("msg");
  msg.className="err"; msg.textContent="「"+name+"」はすでに入力済みなので、その欄に移動しました。";
  jumpToBlock(existing);
}
function removeCharaBlock(btn){
  var block=btn.closest(".chara-block");
  if(block) block.remove();
  if(!document.querySelectorAll(".chara-block").length) addCharaBlock(false);
  renumberBlocks();
}
function resetCharaBlocks(){
  document.getElementById("chara-blocks").innerHTML="";
  addCharaBlock(false);
}
resetCharaBlocks();

/* 既存のキャラ名候補(スレ・登場回の両方から集めて重複排除)をオートコンプリートに入れる */
async function loadCharaList(){
  try{
    var names={};
    var tRes=await sb.from("threads").select("chara_tag").not("chara_tag","is",null);
    (tRes.data||[]).forEach(function(r){ if(r.chara_tag) names[r.chara_tag]=true; });
    var aRes=await sb.from("chara_appearances").select("chara_tag");
    (aRes.data||[]).forEach(function(r){ if(r.chara_tag) names[r.chara_tag]=true; });
    var list=document.getElementById("chara-list");
    list.innerHTML=Object.keys(names).sort().map(function(n){return '<option value="'+esc(n)+'">';}).join("");
  }catch(e){ console.error("loadCharaList error:",e); }
}
loadCharaList();

var recentEntries=[];
function renderRecent(){
  var box=document.getElementById("recent");
  if(!recentEntries.length){ box.innerHTML=""; return; }
  box.innerHTML='<h2>今回追加した分（'+recentEntries.length+'件）</h2>'+
    recentEntries.map(function(e,i){
      var mediaBadge=e.mediaType==="anime"?'<span class="media">📺アニメ</span>':
        (e.mediaType==="manga"?'<span class="media">📖漫画'+(e.volume?' '+esc(e.volume)+'巻':'')+'</span>':'');
      return '<div class="recent-item">'+
        '<span class="undo-btn" onclick="undoEntry('+i+',this)">取り消す</span>'+
        '<span class="chara">'+esc(e.charaTag)+'</span> '+mediaBadge+
        '<div class="label">'+esc(e.label)+'</div>'+
        (e.note?'<span class="note">'+esc(e.note)+'</span>':'')+
        '</div>';
    }).join("");
}
async function undoEntry(i,btnEl){
  var e=recentEntries[i];
  if(!e) return;
  btnEl.textContent="削除中…";
  try{
    var res=await sb.from("chara_appearances").delete().eq("id",e.id);
    if(res.error) throw res.error;
    recentEntries.splice(i,1);
    renderRecent();
    if(lastBatch&&lastBatch.ids.indexOf(e.id)>=0){
      lastBatch.ids=lastBatch.ids.filter(function(x){return x!==e.id;});
      lastBatch.rows=lastBatch.rows.filter(function(r){return r.id!==e.id;});
      if(!lastBatch.ids.length) lastBatch=null;
      renderBackBtn();
    }
  }catch(err){
    alert("取り消しに失敗しました: "+(err.message||err));
  }
}

/* 直前の「まとめて投稿」を取り消して、その内容を入力画面に戻す */
var lastBatch=null;
function renderBackBtn(){
  var wrap=document.getElementById("back-wrap");
  if(!lastBatch){ wrap.innerHTML=""; return; }
  wrap.innerHTML='<button type="button" class="back-btn" onclick="backToLastBatch(this)">↩ 戻る：「'+esc(lastBatch.label)+'」('+lastBatch.ids.length+'人分)の投稿を取り消して入力画面に戻す</button>';
}
function formHasInput(){
  if(document.getElementById("label-inp").value.trim()) return true;
  var inps=document.querySelectorAll(".chara-name-inp,.chara-note-inp");
  for(var i=0;i<inps.length;i++){ if(inps[i].value.trim()) return true; }
  return false;
}
async function backToLastBatch(btnEl){
  var b=lastBatch;
  if(!b) return;
  if(formHasInput()&&!confirm("いま入力中の内容は消えて、「"+b.label+"」の投稿内容に置き換わります。戻りますか？")) return;
  btnEl.disabled=true; btnEl.textContent="戻しています…";
  var msg=document.getElementById("msg");
  try{
    var res=await sb.from("chara_appearances").delete().in("id",b.ids);
    if(res.error) throw res.error;
    recentEntries=recentEntries.filter(function(e){return b.ids.indexOf(e.id)<0;});
    renderRecent();
    /* 入力画面を投稿前の状態に戻す */
    setMedia(b.media);
    document.getElementById("vol-inp").value=b.volume||"";
    document.getElementById("label-inp").value=b.label;
    document.getElementById("chara-blocks").innerHTML="";
    b.rows.forEach(function(r){
      addCharaBlock(false);
      var blocks=document.querySelectorAll(".chara-block");
      var last=blocks[blocks.length-1];
      last.querySelector(".chara-name-inp").value=r.charaTag;
      last.querySelector(".chara-note-inp").value=r.note||"";
    });
    lastBatch=null;
    renderBackBtn();
    msg.className="ok"; msg.textContent="↩ 投稿を取り消して、入力画面に戻しました。続きを入力してからもう一度投稿してください。";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    btnEl.disabled=false; renderBackBtn();
    msg.className="err"; msg.textContent="戻せませんでした: "+(e.message||e);
  }
}

async function submitEntry(){
  var labelInp=document.getElementById("label-inp");
  var volInp=document.getElementById("vol-inp");
  var msg=document.getElementById("msg");
  var btn=document.getElementById("submit-btn");

  var label=labelInp.value.trim().slice(0,60);
  var volume=(currentMedia==="manga")?volInp.value.trim().slice(0,20):"";

  /* キャラ名が入っているブロックだけ投稿対象にする(空ブロックは無視) */
  var blocks=document.querySelectorAll(".chara-block");
  var rows=[];
  for(var i=0;i<blocks.length;i++){
    var name=blocks[i].querySelector(".chara-name-inp").value.trim();
    var note=blocks[i].querySelector(".chara-note-inp").value.trim().slice(0,200);
    if(!name) continue;
    var dup=findBlockByName(name,blocks[i]);
    if(dup&&Array.prototype.indexOf.call(blocks,dup)<i){
      msg.className="err"; msg.textContent="「"+name+"」が2回入力されています。1つにまとめてください。";
      jumpToBlock(blocks[i]);
      return;
    }
    rows.push({charaTag:name,note:note});
  }

  msg.className="";msg.textContent="";
  if(!label){ msg.className="err"; msg.textContent="登場回を入力してください。"; labelInp.focus(); return; }
  if(!rows.length){
    msg.className="err"; msg.textContent="キャラクター名を1人以上入力してください。";
    var first=document.querySelector(".chara-name-inp"); if(first) first.focus();
    return;
  }

  btn.disabled=true; btn.textContent="投稿中…";
  try{
    var payload=rows.map(function(r){
      return {chara_tag:r.charaTag,label:label,note:r.note||null,uid:myIp,media_type:currentMedia,volume:volume||null};
    });
    var res=await sb.from("chara_appearances").insert(payload).select("id,chara_tag,note");
    if(res.error) throw res.error;

    var inserted=res.data||[];
    for(var j=inserted.length-1;j>=0;j--){
      recentEntries.unshift({id:inserted[j].id,charaTag:inserted[j].chara_tag,label:label,note:inserted[j].note,mediaType:currentMedia,volume:volume});
    }
    renderRecent();

    /* 途中で間違えて投稿したとき用に、直前の投稿内容を覚えておく(「戻る」で入力画面に復元できる) */
    lastBatch={ids:inserted.map(function(r){return r.id;}),label:label,media:currentMedia,volume:volume,
      rows:inserted.map(function(r){return {id:r.id,charaTag:r.chara_tag,note:r.note};})};

    /* 媒体・巻数は残し、登場回とキャラ欄だけリセット→次の回をすぐ入力できる */
    labelInp.value="";
    resetCharaBlocks();
    msg.className="ok"; msg.textContent="✅ "+inserted.length+"人分を投稿しました！続けて次の回を入力できます。";
    renderBackBtn();
    labelInp.focus();
    loadCharaList();
  }catch(e){
    msg.className="err"; msg.textContent="投稿に失敗しました: "+(e.message||e);
  }finally{
    btn.disabled=false; btn.textContent="まとめて投稿する";
  }
}
</script>
</body>
</html>
